<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to Save to Margin</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="options">
    <main class="connection-card">
      <div class="brand">
        <img src="icons/icon-48.png" width="40" height="40" alt="" /><span
          >Margin<span class="subtle">Web clipper</span></span
        >
      </div>
      <h1>A place for what you find.</h1>
      <p>Sign in with the email and password you use for Margin Chat.</p>
      <div id="connected" hidden>
        <p id="account"></p>
        <button id="disconnect" type="button">Sign out of this browser</button>
      </div>
      <form id="connection-form">
        <label for="server-url">Margin Chat website</label
        ><input
          id="server-url"
          type="url"
          placeholder="https://your-margin-chat-website"
          required
          autocomplete="url"
        /><label for="email">Email address</label
        ><input
          id="email"
          type="email"
          required
          maxlength="320"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
        /><label for="password">Password</label
        ><input
          id="password"
          type="password"
          required
          maxlength="200"
          autocomplete="current-password"
        /><button id="connect" class="primary" type="submit">Sign in</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="fine-print">
        The extension remembers your session, never your password. Captures are
        sent only when you save. Cloud Inbox requires a paid plan or an admin account.
      </p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
