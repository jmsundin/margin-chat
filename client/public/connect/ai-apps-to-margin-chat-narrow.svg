<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1220" viewBox="0 0 480 1220" role="img" aria-labelledby="title desc">
  <title id="title">Connect your AI apps to Margin Chat</title>
  <desc id="desc">Claude, Claude Code, ChatGPT, Gemini, Meta Muse, Cursor and VS Code connect to Margin Chat's MCP server at www.marginchat.com/api/mcp, by signing in or with a token from Profile, Agents. The server searches and reads your vault and can create documents or add to them, but never edits or deletes anything.</desc>
  <defs>
    <marker id="sage-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7acaa4"/></marker>
    <marker id="violet-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c9b8ff"/></marker>
  </defs>
  <style>
    text { font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif; fill: #ecf4ef; }
    .label { font-size: 14px; font-weight: 600; letter-spacing: 0.08em; fill: #97a9a2; }
    .app { font-size: 18px; font-weight: 500; }
    .tag { font-size: 15px; fill: #97a9a2; }
    .body { font-size: 17px; fill: #b9c8c1; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 17px; fill: #ecf4ef; }
    .node { font-size: 14px; fill: #dbe6e0; }
    .num { font-size: 17px; font-weight: 700; fill: #1a0d08; }
    .wire { fill: none; stroke: rgba(224, 236, 230, 0.28); stroke-width: 1.5; }
  </style>

  <rect width="480" height="1220" rx="24" fill="#0b1318"/>
  <rect x="0.5" y="0.5" width="479" height="1219" rx="24" fill="none" stroke="rgba(224,236,230,0.14)"/>

  <text x="28" y="58" font-size="27" font-weight="600">Your second brain,</text>
  <text x="28" y="92" font-size="27" font-weight="600">inside every AI app</text>
  <text x="28" y="128" class="body">Add one address to the AI you already pay</text>
  <text x="28" y="151" class="body">for. It can search your notes and save</text>
  <text x="28" y="174" class="body">what you make together.</text>

  <!-- AI apps -->
  <text x="28" y="218" class="label">YOUR AI APPS</text>
  <g>
    <rect x="28" y="232" width="206" height="48" rx="12" fill="#101b21" stroke="rgba(224,236,230,0.14)"/>
    <circle cx="48" cy="256" r="5" fill="#ff8d6d"/><text x="62" y="262" class="app">Claude apps</text>
    <rect x="246" y="232" width="206" height="48" rx="12" fill="#101b21" stroke="rgba(224,236,230,0.14)"/>
    <circle cx="266" cy="256" r="5" fill="#ff8d6d"/><text x="280" y="262" class="app">Claude Code</text>
    <rect x="28" y="290" width="206" height="48" rx="12" fill="#101b21" stroke="rgba(224,236,230,0.14)"/>
    <circle cx="48" cy="314" r="5" fill="#7acaa4"/><text x="62" y="320" class="app">ChatGPT</text>
    <rect x="246" y="290" width="206" height="48" rx="12" fill="#101b21" stroke="rgba(224,236,230,0.14)"/>
    <circle cx="266" cy="314" r="5" fill="#c9b8ff"/><text x="280" y="320" class="app">Gemini</text>
    <rect x="28" y="348" width="206" height="48" rx="12" fill="#101b21" stroke="rgba(224,236,230,0.14)"/>
    <circle cx="48" cy="372" r="5" fill="#7acaa4"/><text x="62" y="378" class="app">Muse, Muse Code</text>
    <rect x="246" y="348" width="206" height="48" rx="12" fill="#101b21" stroke="rgba(224,236,230,0.14)"/>
    <circle cx="266" cy="372" r="5" fill="#c9b8ff"/><text x="280" y="378" class="app">Cursor, VS Code</text>
  </g>

  <path class="wire" d="M131 396 C 131 420, 240 410, 240 440"/>
  <path class="wire" d="M349 396 C 349 420, 240 410, 240 440"/>

  <!-- MCP server -->
  <rect x="28" y="440" width="424" height="218" rx="18" fill="#101b21" stroke="#ff8d6d" stroke-width="1.5"/>
  <text x="52" y="476" class="label" style="fill:#ff8d6d">MARGIN CHAT MCP SERVER</text>
  <text x="52" y="510" class="mono">www.marginchat.com/api/mcp</text>
  <line x1="52" y1="530" x2="428" y2="530" stroke="rgba(224,236,230,0.12)"/>
  <g transform="translate(52 550)">
    <circle cx="9" cy="9" r="7" fill="none" stroke="#ff8d6d" stroke-width="2"/>
    <path d="M15 12 26 23M21 18l3-3M24 21l3-3" stroke="#ff8d6d" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="92" y="564" class="app">Proof that it's you</text>
  <text x="92" y="590" class="body">Sign in from the app, or paste a</text>
  <text x="92" y="613" class="body">token from Profile → Agents.</text>
  <text x="52" y="642" class="tag">Plus and Cloud plans · revoke any time</text>

  <!-- server to vault -->
  <path d="M120 660 V 732" stroke="#7acaa4" stroke-width="2" marker-start="url(#sage-head)" marker-end="url(#sage-head)"/>
  <text x="134" y="702" class="tag" style="fill:#7acaa4">search, read</text>
  <path d="M300 660 V 732" stroke="#c9b8ff" stroke-width="2" marker-end="url(#violet-head)"/>
  <text x="314" y="694" class="tag" style="fill:#c9b8ff">create, add</text>
  <text x="314" y="714" class="tag">never edits</text>

  <!-- vault -->
  <rect x="28" y="734" width="424" height="270" rx="18" fill="#101b21" stroke="rgba(224,236,230,0.22)"/>
  <text x="52" y="770" class="label">YOUR VAULT</text>
  <g stroke="rgba(224,236,230,0.24)" stroke-width="1.5">
    <line x1="240" y1="856" x2="126" y2="806"/>
    <line x1="240" y1="856" x2="356" y2="806"/>
    <line x1="240" y1="856" x2="130" y2="910"/>
    <line x1="240" y1="856" x2="350" y2="910"/>
  </g>
  <rect x="52" y="790" width="148" height="32" rx="9" fill="#18262e" stroke="rgba(122,202,164,0.5)"/>
  <text x="126" y="811" class="node" text-anchor="middle">Rapamycin notes</text>
  <rect x="290" y="790" width="132" height="32" rx="9" fill="#18262e" stroke="rgba(122,202,164,0.5)"/>
  <text x="356" y="811" class="node" text-anchor="middle">Paper: mTOR</text>
  <rect x="176" y="840" width="128" height="34" rx="9" fill="#ff8d6d"/>
  <text x="240" y="862" class="node" text-anchor="middle" style="fill:#1a0d08;font-weight:600">Longevity</text>
  <rect x="44" y="894" width="172" height="32" rx="9" fill="#0b1318" stroke="rgba(201,184,255,0.7)" stroke-dasharray="4 3"/>
  <text x="130" y="915" class="node" text-anchor="middle" style="fill:#c9b8ff">Claude Code · session</text>
  <rect x="270" y="894" width="160" height="32" rx="9" fill="#0b1318" stroke="rgba(201,184,255,0.7)" stroke-dasharray="4 3"/>
  <text x="350" y="915" class="node" text-anchor="middle" style="fill:#c9b8ff">Saved from Gemini</text>
  <text x="52" y="960" class="body">Documents, notes, chats and PDFs.</text>
  <text x="52" y="984" class="body">Anything you hide from AI stays out.</text>

  <!-- steps -->
  <circle cx="46" cy="1046" r="17" fill="#ff8d6d"/><text x="46" y="1052" class="num" text-anchor="middle">1</text>
  <text x="76" y="1044" class="app">Make a token in Profile → Agents</text>
  <text x="76" y="1067" class="body">One per app. Apps that sign in skip this.</text>
  <circle cx="46" cy="1110" r="17" fill="#7acaa4"/><text x="46" y="1116" class="num" text-anchor="middle">2</text>
  <text x="76" y="1108" class="app">Add the address in your AI app</text>
  <text x="76" y="1131" class="body">A custom connector, or one command.</text>
  <circle cx="46" cy="1174" r="17" fill="#c9b8ff"/><text x="46" y="1180" class="num" text-anchor="middle">3</text>
  <text x="76" y="1172" class="app">Just ask</text>
  <text x="76" y="1195" class="body">“Save this to Margin Chat.”</text>
</svg>
