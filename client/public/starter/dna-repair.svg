<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="Helvetica, Arial, sans-serif">
  <title>How a cell answers DNA damage</title>
  <rect width="640" height="260" rx="18" fill="#f4f7f5"/>
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M40 90 C 90 40, 140 140, 190 90 S 290 40, 340 90" stroke="#0b8f70"/>
    <path d="M40 90 C 90 140, 140 40, 190 90 S 290 140, 340 90" stroke="#6b5bd2"/>
  </g>
  <g stroke="#9aa6a0" stroke-width="3">
    <line x1="65" y1="70" x2="65" y2="110"/><line x1="115" y1="68" x2="115" y2="112"/>
    <line x1="265" y1="68" x2="265" y2="112"/><line x1="315" y1="70" x2="315" y2="110"/>
  </g>
  <circle cx="190" cy="90" r="22" fill="none" stroke="#d9654c" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="190" y="150" text-anchor="middle" font-size="15" fill="#1b201d">a damaged base</text>
  <path d="M360 90 H 420" stroke="#1b201d" stroke-width="3" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1b201d"/></marker></defs>
  <g font-size="15" fill="#1b201d">
    <rect x="435" y="40" width="175" height="44" rx="10" fill="#dcefe8"/><text x="522" y="67" text-anchor="middle">cut out and replaced</text>
    <rect x="435" y="100" width="175" height="44" rx="10" fill="#fbe5df"/><text x="522" y="127" text-anchor="middle">or the cell stops dividing</text>
  </g>
  <text x="40" y="220" font-size="17" font-weight="700" fill="#1b201d">Repair keeps up when we're young.</text>
  <text x="40" y="242" font-size="15" fill="#5d6661">With age it falls behind, and unrepaired damage builds up.</text>
</svg>
