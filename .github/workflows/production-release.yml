name: Production release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full reviewed Git commit SHA to release
        required: true
        type: string

# All refs share one queue; never cancel a running migration or release.
concurrency:
  group: margin-chat-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Verify immutable release selection
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          bun --no-env-file -e 'if (!/^[a-f0-9]{40}$/.test(process.env.RELEASE_COMMIT)) throw new Error("Select a full commit SHA"); const actual = Bun.spawnSync(["git", "rev-parse", "HEAD"]).stdout.toString().trim(); if (actual !== process.env.RELEASE_COMMIT) throw new Error("Checkout does not match release SHA");'
      - name: Install pinned dependencies
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Rehearse, migrate, verify, and promote
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          REHEARSAL_BLOB_READ_WRITE_TOKEN: ${{ secrets.REHEARSAL_BLOB_READ_WRITE_TOKEN }}
          BACKUP_BLOB_READ_WRITE_TOKEN: ${{ secrets.BACKUP_BLOB_READ_WRITE_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: bun run release:production
      - name: Retain release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-artifacts/releases/*.json
          if-no-files-found: ignore
          retention-days: 30
