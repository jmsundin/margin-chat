name: Production release

on:
  # Every commit on main releases itself once CI has passed on it.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full reviewed Git commit SHA to release (leave empty to release the head of the selected branch)
        required: false
        type: string

# All refs share one queue; never cancel a running migration or release. While
# one runs, GitHub keeps only the newest waiting run: it releases main's newest
# commit, which includes the commits of the waiting runs it replaced.
concurrency:
  group: margin-chat-production-release
  cancel-in-progress: false

permissions:
  contents: read
  # Reads the CI result for the release commit instead of re-running the tests.
  actions: read

jobs:
  release:
    # Automatic runs only for CI that passed on a push to main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Skip a commit that main has moved past
        id: current
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          # CI runs can finish out of order. Releasing an older commit after a
          # newer one would roll production back, so only main's newest commit
          # is released; a newer commit's own CI run releases it.
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$RELEASE_COMMIT" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: main has moved past $RELEASE_COMMIT; the newer commit's CI run releases it."
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.current.outputs.release != 'false'
        with:
          bun-version: 1.3.9
      - name: Verify immutable release selection
        if: steps.current.outputs.release != 'false'
        env:
          RELEASE_COMMIT: ${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}
        run: |
          bun --no-env-file -e 'if (!/^[a-f0-9]{40}$/.test(process.env.RELEASE_COMMIT)) throw new Error("Select a full commit SHA"); const actual = Bun.spawnSync(["git", "rev-parse", "HEAD"]).stdout.toString().trim(); if (actual !== process.env.RELEASE_COMMIT) throw new Error("Checkout does not match release SHA");'
      - name: Install pinned dependencies
        if: steps.current.outputs.release != 'false'
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Rehearse, migrate, verify, and promote
        if: steps.current.outputs.release != 'false'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          REHEARSAL_BLOB_READ_WRITE_TOKEN: ${{ secrets.REHEARSAL_BLOB_READ_WRITE_TOKEN }}
          BACKUP_BLOB_READ_WRITE_TOKEN: ${{ secrets.BACKUP_BLOB_READ_WRITE_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run release:production
      - name: Retain release report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-artifacts/releases/*.json
          if-no-files-found: ignore
          retention-days: 30
