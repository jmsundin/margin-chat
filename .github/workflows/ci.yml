name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an in-flight run for the same pull request or branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install pinned dependencies
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Typecheck extension
        run: bunx tsc --noEmit
        working-directory: extension
      - name: Build client
        # Runs the client typecheck (tsc) before bundling.
        run: bun run build
      - name: Test
        # Tests use in-process PGlite and fixtures; no secrets or services needed.
        run: bun --no-env-file test
